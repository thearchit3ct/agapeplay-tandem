name: Bug
description: Signaler un comportement incorrect
title: "[BUG] "
labels:
  - type:bug
body:
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Plateforme et version
      placeholder: Web / iOS / Android, version de l'application
  - type: textarea
    id: privacy
    attributes:
      label: Impact sécurité ou confidentialité
      description: Indiquer immédiatement si des données privées sont visibles ou perdues.
